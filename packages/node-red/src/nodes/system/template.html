<div class="form-row">

</div>

	<label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="system.label.name"></span></label>
	<input type="text" id="node-input-name" data-i18n="[placeholder]system.placeholder.name" />
</div>

</div>
<div class="form-row" id="node-input-action-row">
